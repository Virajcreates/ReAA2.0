# Azure deploy settings for REAA (committed; NOTHING SECRET goes in here).
#
# Read by deploy/azure.sh, deploy/github-setup.sh, deploy/vercel-env.sh and
# the GitHub workflow .github/workflows/azure.yml (no GitHub Actions
# variables or secrets are used). The scripts fill in the "written by" lines;
# the last setup script then prints the git command that publishes this file.
# The workflow skips quietly until the values it needs are filled in.
#
# None of these values are secrets: the IDs grant nothing on their own (only
# GitHub runs on main of this repository can sign in with them), and the
# WEB_ENV_ values are public (they are inside the website's JavaScript).
# API keys and passwords live only in .env.azure (never committed) and in the
# container app's secrets.
#
# Format: KEY=value, one per line, no quotes, no spaces around "=".

# --- Project: everything in Azure is named after APP_NAME ---
# Resource group <app>, container app <app>, deploy identity <app>-github,
# registry <app without dashes><first 8 hex of the subscription>, image
# <registry>.azurecr.io/<app>. Settings in .env.azure are named KEY_reaa.
# Lower-case letters, digits and dashes; starts with a letter; max 32 chars;
# must differ from every other app in the shared environment.
APP_NAME=reaa
# GitHub repository (owner/name) whose main branch may deploy. Not used for
# any Azure name.
GITHUB_REPO=Virajcreates/ReAA2.0
# Numeric owner and repository IDs (gh api repos/<owner>/<repo>), for the
# ID form of GitHub's OIDC subject. github-setup.sh re-checks them.
GITHUB_OWNER_ID=158842407
GITHUB_REPO_ID=1344780090

# --- Current host (left running; only read by deploy/vercel-env.sh) ---
# Vercel project whose settings are copied into .env.azure (it serves
# https://re-aa-2-0.vercel.app). If the name is wrong, vercel-env.sh lists
# the projects your token can see.
VERCEL_PROJECT_NAME=re-aa-2-0
# Vercel team the project belongs to (team ID "team_..." or its URL slug).
# Leave empty if the project is in a personal (Hobby) account.
VERCEL_TEAM=virajcreates-projects

# --- Azure subscription and region ---
AZURE_SUBSCRIPTION_ID=82aaf9d4-d161-4dab-8ecf-dff34de35353
AZURE_LOCATION=centralindia

# --- Shared Container Apps environment (read only: never created or changed) ---
ACA_ENV_NAME=purva-bot-env
ACA_ENV_RESOURCE_GROUP=purva-bot

# --- Container app size ---
# Path that answers 200 cheaply once the app is up. The app has no /health
# route; /login is a pre-built page (no database call; the Supabase sign-in
# check in middleware makes no network call when there is no login cookie).
HEALTH_PATH=/login
# vCPU and memory per replica (valid pairs: 0.25/0.5Gi, 0.5/1Gi, 0.75/1.5Gi ...).
# Measured with docker stats: idle ~85MiB. Heaviest real job = chat with PDFs
# attached (3 x 6MB, the UI's limit), 4 people at once: 0.25/0.5Gi ran out of
# memory (pages took ~23 s); 0.5/1Gi peaked at 75% of memory; 0.75/1.5Gi
# peaked at 51% and answered pages twice as fast. With 1-2 people at a time
# 0.5/1Gi peaked at 40%, so 0.5/1Gi is used (cheaper always-on); go to
# 0.75/1.5Gi if many people attach PDFs at the same time.
CPU=0.5
MEMORY=1Gi
# 1 = always on: nobody waits for a cold start (~10-30 s). 0 would let it
# sleep when unused (cheaper; there are no background jobs or webhooks).
MIN_REPLICAS=1
# Nothing is kept in memory or on disk between requests (chats, files and
# logins live in Supabase), so more than one copy is safe; 2 caps the cost.
MAX_REPLICAS=2

# --- Written by deploy/azure.sh ---
# Container registry (Basic) for this project only.
ACR_NAME=reaa82aaf9d4
# Public address of the container app (website and API, same address).
BACKEND_URL=https://reaa.lemonfield-c4c1d145.centralindia.azurecontainerapps.io

# --- Written by deploy/github-setup.sh ---
# Client ID of the deploy identity <app>-github, and the Azure tenant.
AZURE_CLIENT_ID=3e6bc570-f47b-4c49-92e3-9fe208d14c1f
AZURE_TENANT_ID=994a6b1b-9716-479f-8871-5cba672279aa

# --- Website build settings (public; passed to "next build" without the
# WEB_ENV_ prefix) ---
# The website is built into the same image as the server and served from the
# same address (no Static Web App, no CORS). deploy/azure.sh copies these from
# SUPABASE_URL_reaa and SUPABASE_PUBLISHABLE_KEY_reaa in .env.azure; the key
# must be the publishable (sb_publishable_...) or legacy "anon" key, never the
# secret/service_role key. Both are required: the workflow stops if empty.
WEB_ENV_NEXT_PUBLIC_SUPABASE_URL=https://hcwhcrsgnkuqonqyrvpx.supabase.co
WEB_ENV_NEXT_PUBLIC_SUPABASE_ANON_KEY=sb_publishable_cSfEfu4GnMK5ZXAIeuSK6A_pI0b5X8R
