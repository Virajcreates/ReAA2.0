# Build the image (Next.js website + API in one container), push it to this
# project's Azure registry and roll it out to the container app. Settings
# (secrets, env vars, size) are never touched here: deploy/azure.sh owns them.
# The public website build settings come from WEB_ENV_* in the config file.
#
# All values come from deploy/azure-deploy.conf (no GitHub variables or
# secrets). Until deploy/azure.sh and deploy/github-setup.sh have filled it
# in, this workflow finishes quietly with a notice.
name: Deploy to Azure

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "components/**"
      - "hooks/**"
      - "lib/**"
      - "types/**"
      - "utils/**"
      - "public/**"
      - "middleware.ts"
      - "next.config.mjs"
      - "next-env.d.ts"
      - "package.json"
      - "package-lock.json"
      - "tailwind.config.ts"
      - "postcss.config.mjs"
      - "tsconfig.json"
      - "deploy/Dockerfile"
      - "deploy/Dockerfile.dockerignore"
      - "deploy/redirect-host.cjs"
      - "deploy/azure-deploy.conf"
      - ".github/workflows/azure.yml"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: azure-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Read deploy/azure-deploy.conf
        id: conf
        shell: bash
        run: |
          set -euo pipefail
          conf=deploy/azure-deploy.conf
          get() {
            awk -v k="$1" '{ sub(/\r$/, "") } /^[ \t]*#/ { next } index($0, "=") == 0 { next }
              { key = substr($0, 1, index($0, "=") - 1); gsub(/^[ \t]+|[ \t]+$/, "", key)
                if (key == k) { v = substr($0, index($0, "=") + 1); gsub(/^[ \t]+|[ \t]+$/, "", v); val = v } }
              END { print val }' "$conf"
          }
          app="$(get APP_NAME)"; sub="$(get AZURE_SUBSCRIPTION_ID)"; tenant="$(get AZURE_TENANT_ID)"
          client="$(get AZURE_CLIENT_ID)"; acr="$(get ACR_NAME)"; health="$(get HEALTH_PATH)"

          if [ "${GITHUB_REF}" != "refs/heads/main" ]; then
            echo "::notice::Deploys run only from main (this is ${GITHUB_REF}); skipping."
            echo "ready=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          missing=""
          for k in app sub tenant client acr; do [ -n "${!k}" ] || missing="$missing $k"; done
          if [ -n "$missing" ]; then
            echo "::notice::Azure isn't set up yet (empty in $conf:$missing). Run deploy/azure.sh and deploy/github-setup.sh (see deploy/AZURE.md). Skipping."
            echo "ready=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          guid='^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
          echo "$app" | grep -Eq '^[a-z][a-z0-9-]{0,31}$' || { echo "::error::bad APP_NAME"; exit 1; }
          echo "$acr" | grep -Eq '^[a-z0-9]{5,50}$' || { echo "::error::bad ACR_NAME"; exit 1; }
          for v in "$sub" "$tenant" "$client"; do echo "$v" | grep -Eq "$guid" || { echo "::error::bad ID in $conf"; exit 1; }; done
          case "$health" in /*) ;; *) health=/ ;; esac

          # Website build settings: WEB_ENV_<NAME>=value -> --build-arg <NAME>=value.
          # Public values only (they end up in the browser's JavaScript).
          : > "$RUNNER_TEMP/build-args"
          awk '{ sub(/\r$/, "") } /^[ \t]*WEB_ENV_[A-Za-z0-9_]+=/ { sub(/^[ \t]*WEB_ENV_/, ""); print }' "$conf" \
            | while IFS= read -r line; do
                name="${line%%=*}"; val="${line#*=}"
                printf '%s\n' "$name" | grep -Eq '^[A-Za-z_][A-Za-z0-9_]*$' || { echo "::error::bad WEB_ENV_ name in $conf"; exit 1; }
                printf '%s=%s\n' "$name" "$val" >> "$RUNNER_TEMP/build-args"
              done
          for req in NEXT_PUBLIC_SUPABASE_URL NEXT_PUBLIC_SUPABASE_ANON_KEY; do
            v="$(grep -m1 "^$req=" "$RUNNER_TEMP/build-args" | cut -d= -f2- || true)"
            if [ -z "$v" ]; then
              echo "::error::WEB_ENV_$req is empty in $conf. deploy/azure.sh fills it from .env.azure (see deploy/AZURE.md); the website can't sign anyone in without it."
              exit 1
            fi
          done

          {
            echo "ready=true"
            echo "app=$app"
            echo "sub=$sub"
            echo "tenant=$tenant"
            echo "client=$client"
            echo "acr=$acr"
            echo "health=$health"
            echo "sburl=$(grep -m1 '^NEXT_PUBLIC_SUPABASE_URL=' "$RUNNER_TEMP/build-args" | cut -d= -f2-)"
            echo "image=$acr.azurecr.io/$app:$(git rev-parse --short=12 HEAD)-${GITHUB_RUN_ATTEMPT}"
          } >> "$GITHUB_OUTPUT"

      - name: Sign in to Azure (OIDC, no stored secret)
        if: steps.conf.outputs.ready == 'true'
        uses: azure/login@v3
        with:
          client-id: ${{ steps.conf.outputs.client }}
          tenant-id: ${{ steps.conf.outputs.tenant }}
          subscription-id: ${{ steps.conf.outputs.sub }}

      - name: Build image
        if: steps.conf.outputs.ready == 'true'
        env:
          IMAGE: ${{ steps.conf.outputs.image }}
        run: |
          set -euo pipefail
          args=()
          while IFS= read -r a; do [ -n "$a" ] && args+=(--build-arg "$a"); done < "$RUNNER_TEMP/build-args"
          docker build --platform linux/amd64 -f deploy/Dockerfile "${args[@]}" -t "$IMAGE" .

      - name: Push image
        if: steps.conf.outputs.ready == 'true'
        env:
          ACR: ${{ steps.conf.outputs.acr }}
          IMAGE: ${{ steps.conf.outputs.image }}
        run: |
          az extension add --name containerapp --upgrade --yes --only-show-errors
          az acr login --name "$ACR"
          docker push "$IMAGE"

      - name: Roll out the new image
        if: steps.conf.outputs.ready == 'true'
        env:
          APP: ${{ steps.conf.outputs.app }}
          IMAGE: ${{ steps.conf.outputs.image }}
        run: az containerapp update --name "$APP" --resource-group "$APP" --image "$IMAGE" -o none

      - name: Wait until the new revision is ready and healthy (up to 5 minutes)
        if: steps.conf.outputs.ready == 'true'
        env:
          APP: ${{ steps.conf.outputs.app }}
          IMAGE: ${{ steps.conf.outputs.image }}
          HEALTH: ${{ steps.conf.outputs.health }}
          SBURL: ${{ steps.conf.outputs.sburl }}
        run: |
          set -uo pipefail
          deadline=$(( $(date +%s) + 300 ))
          while :; do
            j="$(az containerapp show --name "$APP" --resource-group "$APP" -o json 2>/dev/null || echo '{}')"
            latest="$(echo "$j" | jq -r '.properties.latestRevisionName // ""')"
            ready="$(echo "$j" | jq -r '.properties.latestReadyRevisionName // ""')"
            cur_image="$(echo "$j" | jq -r '.properties.template.containers[0].image // ""')"
            fqdn="$(echo "$j" | jq -r '.properties.configuration.ingress.fqdn // ""')"
            code=000
            if [ -n "$latest" ] && [ "$latest" = "$ready" ] && [ "$cur_image" = "$IMAGE" ] && [ -n "$fqdn" ]; then
              code="$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "https://$fqdn$HEALTH" || true)"
              if [ "$code" = 200 ]; then
                echo "Revision $latest is ready and https://$fqdn$HEALTH answers 200."
                # The website parts: hashed files served, a missing one is 404,
                # and the browser code has the Supabase address built in.
                page="$(curl -s --max-time 20 "https://$fqdn/login" || true)"
                found=0
                for js in $(printf '%s' "$page" | grep -oE '/_next/static/[^"]+\.js' | sort -u); do
                  if curl -s --max-time 20 "https://$fqdn$js" | grep -qF "$SBURL"; then found=1; break; fi
                done
                missing="$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "https://$fqdn/_next/static/chunks/missing-0000000000.js" || true)"
                if [ "$found" != 1 ]; then echo "::error::The website's JavaScript doesn't contain $SBURL (WEB_ENV_NEXT_PUBLIC_SUPABASE_URL)."; exit 1; fi
                if [ "$missing" != 404 ]; then echo "::error::A missing /_next/static file answered $missing instead of 404."; exit 1; fi
                echo "### Deployed \`$IMAGE\` to https://$fqdn" >> "$GITHUB_STEP_SUMMARY"
                exit 0
              fi
            fi
            echo "waiting: latest=$latest ready=$ready health=$code"
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "::error::Revision $latest did not become ready and healthy within 5 minutes."
              az containerapp revision show --name "$APP" --resource-group "$APP" --revision "$latest" \
                --query "{state:properties.runningState, health:properties.healthState, details:properties.runningStateDetails}" -o json || true
              az containerapp logs show --name "$APP" --resource-group "$APP" --revision "$latest" --tail 50 --type console 2>/dev/null || true
              exit 1
            fi
            sleep 10
          done
